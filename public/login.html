<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Swaggeroo CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#050B18;color:#ECF2FF;font:15px/1.45 'DM Sans',system-ui,sans-serif;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(37,99,235,.28),transparent 60%)}
form{width:min(380px,100%);background:#0B162E;border:1px solid #2F6BFF;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 60px rgba(47,107,255,.3)}
img{width:230px;max-width:100%;height:auto;align-self:center}
h1{font:600 20px 'Sora','DM Sans',sans-serif;margin:4px 0 0;text-align:center}
label{font-size:12px;color:#A3B4D6;display:flex;flex-direction:column;gap:4px}
input{font:inherit;color:inherit;background:#081226;border:1px solid #1B3566;border-radius:9px;padding:10px 12px}
input:focus{outline:none;border-color:#60A5FA;box-shadow:0 0 0 3px rgba(47,107,255,.25)}
button{font:inherit;font-weight:600;color:#fff;border:0;border-radius:9px;padding:11px;cursor:pointer;background:linear-gradient(180deg,#2F6BFF,#1D4ED8);box-shadow:0 0 18px rgba(47,107,255,.4)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #F2913A;outline-offset:2px}
#err{color:#FCA5A5;font-size:13.5px;margin:0;min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <img src="/logo.webp" alt="Swaggeroo" width="460" height="106">
  <h1>Sign in to your CRM</h1>
  <label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <p id="err" role="alert"></p>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Sign in failed. Try again.';
  } catch (x) { err.textContent = 'The server could not be reached. Try again.'; }
  go.disabled = false;
});
</script>
</body>
</html>
